[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "camotion"
version = "0.1.0"
description = "Deterministic camera-motion conditioning for TunnelVision (radial-exposure experiment)."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Product Camotion still runs without this extra. Missing depth is
# non-fatal (dest/VP weights only). First estimate downloads
# depth-anything/Depth-Anything-V2-Small-hf into the Hugging Face cache.
depth = [
    "torch>=2.2",
    "transformers>=4.40",
    "huggingface_hub>=0.24",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
